                <script src="script.js?v=6"></script>

    <script>
        // ── STATE ───────────────────────────────────────────
        let animeData = null;
        let allContent = [];
        let detailInList = false;
        const params = new URLSearchParams(window.location.search);
        const animeId = params.get('anime');

        // ── LOAD ────────────────────────────────────────────
        if (!animeId) { window.location.href = 'index.html'; }

        loadDetailFromApi();

        function cleanTitleForTMDB(title) {
            if (!title) return '';
            return title
                .replace(/\(Dub\)/gi, '')
                .replace(/\(Sub\)/gi, '')
                .replace(/\(TV\)/gi, '')
                .replace(/\(UNCENSORED\)/gi, '')
                .replace(/- Dub/gi, '')
                .replace(/- Sub/gi, '')
                .replace(/:/g, ' ')
                .replace(/  +/g, ' ')
                .trim();
        }

        async function loadDetailFromApi() {
            try {
                const [detailData, popularData] = await Promise.all([
                    getJson(`/gogoanime/anime/${encodeURIComponent(animeId)}`, null),
                    getJson('/gogoanime/popular?page=1', { animes: [] })
                ]);

                if (!detailData) { window.location.href = 'index.html'; return; }

                animeData = normalizeGogoAnimeDetail(detailData, animeId);
                allContent = (popularData.animes || popularData || [])
                    .map(item => normalizeGogoAnimeItem(item, { type: 'series' }))
                    .filter(item => item.id && item.id !== animeId);

                // ENRICH WITH RICH TMDB METADATA
                try {
                    const searchTitle = cleanTitleForTMDB(animeData.title);
                    const tmdbSearch = await getJson(`/tmdb/search?q=${encodeURIComponent(searchTitle)}`, null);
                    if (tmdbSearch && tmdbSearch.length > 0) {
                        const match = tmdbSearch.find(item => 
                            (item.name || item.title || '').toLowerCase() === searchTitle.toLowerCase() ||
                            (item.original_name || item.original_title || '').toLowerCase() === searchTitle.toLowerCase()
                        ) || tmdbSearch[0];

                        if (match) {
                            const mediaType = match.media_type || (match.first_air_date ? 'tv' : 'movie');
                            const tmdbDetails = await getJson(`/tmdb/info/${match.id}?type=${mediaType}`, null);
                            if (tmdbDetails) {
                                if (tmdbDetails.backdrop_path) {
                                    animeData.banner = `https://image.tmdb.org/t/p/original${tmdbDetails.backdrop_path}`;
                                }
                                const logoItem = tmdbDetails.images?.logos?.find(l => l.iso_639_1 === 'en') || tmdbDetails.images?.logos?.[0];
                                if (logoItem) {
                                    animeData.logo = `https://image.tmdb.org/t/p/original${logoItem.file_path}`;
                                }
                                if (tmdbDetails.tagline) {
                                    animeData.tagline = tmdbDetails.tagline;
                                }
                                if (tmdbDetails.overview) {
                                    animeData.description = tmdbDetails.overview;
                                }
                                if (tmdbDetails.vote_average) {
                                    animeData.rating = tmdbDetails.vote_average.toFixed(1);
                                    animeData.voteCount = tmdbDetails.vote_count;
                                }
                                if (tmdbDetails.popularity) {
                                    animeData.popularity = tmdbDetails.popularity;
                                }
                                if (tmdbDetails.runtime || (tmdbDetails.episode_run_time && tmdbDetails.episode_run_time.length)) {
                                    animeData.runtime = tmdbDetails.runtime || tmdbDetails.episode_run_time[0];
                                }
                                if (tmdbDetails.production_companies) {
                                    animeData.studios = tmdbDetails.production_companies.map(c => c.name);
                                }
                                if (tmdbDetails.created_by) {
                                    animeData.creators = tmdbDetails.created_by.map(c => c.name);
                                }
                                if (tmdbDetails.networks) {
                                    animeData.networks = tmdbDetails.networks.map(n => n.name);
                                }
                                if (tmdbDetails.original_language) {
                                    animeData.originalLanguage = tmdbDetails.original_language.toUpperCase();
                                }
                                if (tmdbDetails.origin_country) {
                                    animeData.originCountry = tmdbDetails.origin_country;
                                }
                                if (tmdbDetails.external_ids?.imdb_id) {
                                    animeData.imdbId = tmdbDetails.external_ids.imdb_id;
                                }
                                if (tmdbDetails.homepage) {
                                    animeData.homepage = tmdbDetails.homepage;
                                }
                                if (tmdbDetails.credits?.cast) {
                                    animeData.cast = tmdbDetails.credits.cast.slice(0, 10).map(c => ({
                                        name: c.name,
                                        character: c.character,
                                        photo: c.profile_path ? `https://image.tmdb.org/t/p/w185${c.profile_path}` : null
                                    }));
                                }

                                // Dynamic Parallel TMDB Season Fetcher to map actual episode thumbnails & synopsis details!
                                if (tmdbDetails.seasons && tmdbDetails.seasons.length > 0) {
                                    try {
                                        const activeSeasons = tmdbDetails.seasons.filter(s => s.season_number > 0);
                                        const targetSeasons = activeSeasons.slice(0, 8); // Support up to 8 seasons
                                        const seasonPromises = targetSeasons.map(s => 
                                            getJson(`/tmdb/tv/${match.id}/season/${s.season_number}`, null)
                                        );
                                        const seasonsData = await Promise.all(seasonPromises);
                                        
                                        const flatEpisodes = [];
                                        seasonsData.forEach(sData => {
                                            if (sData && sData.episodes) {
                                                sData.episodes.forEach(ep => {
                                                    flatEpisodes.push({
                                                        episodeNo: ep.episode_number,
                                                        seasonNo: sData.season_number,
                                                        title: ep.name,
                                                        overview: ep.overview,
                                                        still: ep.still_path ? `https://image.tmdb.org/t/p/w300${ep.still_path}` : null
                                                    });
                                                });
                                            }
                                        });
                                        animeData.tmdbEpisodes = flatEpisodes;
                                    } catch (err) {
                                        console.error('Failed to parse TMDB seasons:', err);
                                    }
                                }
                            }
                        }
                    }
                } catch(tmdbErr) {
                    console.error('TMDB Enrichment error:', tmdbErr);
                }

                renderDetailPage();
                renderRelated();
                document.getElementById('detail-loading').style.display = 'none';
                document.getElementById('detail-content').style.display = 'block';
                document.title = `${animeData.title} - AniStream`;

                auth.onAuthStateChanged(user => {
                    currentUser = user;
                    if (user) checkDetailListStatus();
                    const mb = document.getElementById('mobile-profile-btn');
                    if (mb && user) mb.innerHTML = `<img src="${user.photoURL || ''}" style="width:22px;height:22px;border-radius:50%;object-fit:cover;"><span>Profile</span>`;
                });
            } catch (error) {
                console.error('Failed to load anime details', error);
                window.location.href = 'index.html';
            }
        }

        false && Promise.all([
            db.collection('animes').doc(animeId).get(),
            db.collection('animes').get()
        ]).then(([docSnap, allSnap]) => {
            if (!docSnap.exists) { window.location.href = 'index.html'; return; }

            animeData = { id: animeId, ...docSnap.data() };
            allSnap.forEach(d => allContent.push({ id: d.id, ...d.data() }));

            renderDetailPage();
            renderRelated();
            document.getElementById('detail-loading').style.display = 'none';
            document.getElementById('detail-content').style.display = 'block';

            // Update title
            document.title = `${animeData.title} — AniStream`;

            // Check my list
            auth.onAuthStateChanged(user => {
                currentUser = user;
                if (user) checkDetailListStatus();
                // update mobile profile btn
                const mb = document.getElementById('mobile-profile-btn');
                if (mb && user) mb.innerHTML = `<img src="${user.photoURL || ''}" style="width:22px;height:22px;border-radius:50%;object-fit:cover;"><span>Profile</span>`;
            });
        }).catch(() => window.location.href = 'index.html');

        // ── RENDER PAGE ─────────────────────────────────────
        function renderDetailPage() {
            const d = animeData;

            // Banner & poster
            document.getElementById('d-banner').src = d.banner || d.image || '';
            document.getElementById('d-poster').src = d.image || '';
            document.getElementById('d-poster').alt = d.title;
            document.getElementById('d-title').innerText = d.title;

            // Tagline / description
            if (d.tagline) {
                const tq = document.getElementById('d-tagline');
                tq.innerText = `"${d.tagline}"`;
                tq.style.display = 'block';
            }
            // Description Toggle Logic
            const descEl = document.getElementById('d-desc');
            const showMoreBtn = document.getElementById('d-show-more');
            if (d.description) {
                descEl.innerText = d.description;
                if (d.description.length > 250) {
                    descEl.classList.add('desc-collapsed');
                    showMoreBtn.style.display = 'inline-flex';
                    showMoreBtn.classList.remove('expanded');
                    showMoreBtn.innerHTML = 'Show More <i class="fas fa-chevron-down"></i>';
                } else {
                    descEl.classList.remove('desc-collapsed');
                    showMoreBtn.style.display = 'none';
                }
            } else {
                descEl.innerText = 'No description available for this title.';
                descEl.classList.remove('desc-collapsed');
                showMoreBtn.style.display = 'none';
            }

            // Badges
            const badgesEl = document.getElementById('d-badges');
            const badges = [];
            if (d.rating) badges.push(`<span class="detail-badge db-score">★ ${d.rating}</span>`);
            (d.genres || []).forEach(g => badges.push(`<span class="detail-badge db-genre">${g}</span>`));
            if (d.type) badges.push(`<span class="detail-badge db-type">${d.type === 'movie' ? 'Movie' : 'Series'}</span>`);
            const statusClass = { ongoing: 'db-status-ongoing', completed: 'db-status-completed', upcoming: 'db-status-upcoming' }[d.status] || 'db-genre';
            if (d.status) badges.push(`<span class="detail-badge ${statusClass}">${capitalize(d.status)}</span>`);
            badgesEl.innerHTML = badges.join('');

            // Meta row
            const metaEl = document.getElementById('d-meta');
            const metas = [];
            if (d.year) metas.push(`<span><i class="fas fa-calendar"></i>${d.year}</span>`);
            if (d.language) metas.push(`<span><i class="fas fa-language"></i>${d.language}</span>`);
            if (d.type !== 'movie' && d.sub) metas.push(`<span><i class="fas fa-closed-captioning"></i>${d.sub} Sub Ep</span>`);
            if (d.dub) metas.push(`<span><i class="fas fa-microphone"></i>${d.dub} Dub Ep</span>`);
            if (d.type !== 'movie' && d.seasons) metas.push(`<span><i class="fas fa-layer-group"></i>${d.seasons.length} Season${d.seasons.length !== 1 ? 's' : ''}</span>`);
            metaEl.innerHTML = metas.join('<span style="color:var(--text-3)">·</span>');

            // Populate Info Card fields
            if (d.type) { document.getElementById('info-type-val').innerText = d.type === 'movie' ? 'Movie' : 'TV Series'; document.getElementById('info-type').style.display = 'flex'; }
            if (d.status) { document.getElementById('info-status-val').innerText = d.status; document.getElementById('info-status').style.display = 'flex'; }
            if (d.type !== 'movie' && d.sub) { document.getElementById('info-eps-val').innerText = d.sub; document.getElementById('info-eps').style.display = 'flex'; }
            if (d.language) { document.getElementById('info-lang-val').innerText = d.language; document.getElementById('info-lang').style.display = 'flex'; }
            if (d.originalLanguage) { document.getElementById('info-orig-val').innerText = d.originalLanguage; document.getElementById('info-orig').style.display = 'flex'; }
            if (d.originCountry && d.originCountry.length) { document.getElementById('info-country-val').innerText = d.originCountry.join(', '); document.getElementById('info-country').style.display = 'flex'; }
            if (d.runtime) { document.getElementById('info-dur-val').innerText = d.runtime + 'm'; document.getElementById('info-dur').style.display = 'flex'; }

            // Format studios: join if array, otherwise show string
            if (d.studios) {
                const sText = Array.isArray(d.studios) ? d.studios.join(', ') : d.studios;
                if (sText) { document.getElementById('info-studio-val').innerText = sText; document.getElementById('info-studio').style.display = 'flex'; }
            }

            if (d.creators && d.creators.length) { document.getElementById('info-creator-val').innerText = d.creators.join(', '); document.getElementById('info-creator').style.display = 'flex'; }
            if (d.networks && d.networks.length) { document.getElementById('info-network-val').innerText = d.networks.join(', '); document.getElementById('info-network').style.display = 'flex'; }

            if (d.rating) {
                let ratingHtml = `★ ${d.rating}`;
                if (d.voteCount) ratingHtml += ` <span style="font-size:0.75rem;color:var(--text-3);font-weight:400">(${d.voteCount.toLocaleString()})</span>`;
                document.getElementById('info-rating-val').innerHTML = ratingHtml;
                document.getElementById('info-rating').style.display = 'flex';
            }

            if (d.popularity) {
                const popVal = Math.round(d.popularity);
                document.getElementById('info-pop-val').innerText = '🔥 ' + popVal.toLocaleString();
                document.getElementById('info-pop').style.display = 'flex';
            }

            // External links
            const extLinks = [];
            if (d.imdbId) extLinks.push(`<a class="ext-link ext-link-imdb" href="https://www.imdb.com/title/${d.imdbId}" target="_blank"><i class="fas fa-film"></i> IMDb</a>`);
            if (d.homepage) extLinks.push(`<a class="ext-link ext-link-web" href="${d.homepage}" target="_blank"><i class="fas fa-globe"></i> Website</a>`);
            if (extLinks.length) {
                document.getElementById('ext-links-row').innerHTML = extLinks.join('');
                document.getElementById('info-ext-links').style.display = 'block';
            }

            // Logo on hero
            if (d.logo) {
                const logoEl = document.getElementById('d-logo');
                const logoWrap = document.getElementById('d-logo-wrap');
                logoEl.src = d.logo;
                logoEl.alt = d.title + ' logo';
                logoEl.onload = () => { logoWrap.style.display = 'block'; document.getElementById('d-title').style.display = 'none'; };
                logoEl.onerror = () => { logoWrap.style.display = 'none'; };
            }

            // Cast row
            if (d.cast && d.cast.length) {
                const castRow = document.getElementById('cast-row');
                castRow.innerHTML = d.cast.map(actor => `
                    <div class="cast-card">
                        ${actor.photo
                        ? `<img class="cast-photo" src="${actor.photo}" alt="${actor.name}" loading="lazy" onerror="this.outerHTML='<div class=cast-photo-placeholder><i class=fas fa-user></i></div>'">`
                        : `<div class="cast-photo-placeholder"><i class="fas fa-user"></i></div>`
                    }
                        <div class="cast-name">${actor.name}</div>
                        <div class="cast-character">${actor.character || ''}</div>
                    </div>`).join('');
                document.getElementById('cast-section').style.display = 'block';
            }

            // Episodes or Movie
            if ((d.type || '').toLowerCase() === 'movie') {
                document.getElementById('episodes-section').style.display = 'none';
                document.getElementById('d-play-btn').onclick = () => window.location.href = `watch.html?anime=${animeId}`;
            } else {
                buildSeasonSelect();
                renderDetailEpisodes();
            }

            // Trailer — extract YouTube video ID, embed inline
            if (d.trailer) {
                const trailerUrl = d.trailer.trim();
                const vidIdMatch = trailerUrl.match(/(?:embed\/|v=|youtu\.be\/|shorts\/)([a-zA-Z0-9_-]{11})/);
                const vidId = vidIdMatch ? vidIdMatch[1] : null;

                let embedUrl = '';
                if (vidId) {
                    embedUrl = `https://www.youtube.com/embed/${vidId}?rel=0&modestbranding=1`;
                } else if (trailerUrl.includes('youtube.com/embed/')) {
                    embedUrl = trailerUrl + (trailerUrl.includes('?') ? '&' : '?') + 'rel=0';
                } else {
                    embedUrl = trailerUrl;
                }

                document.getElementById('trailer-iframe').src = embedUrl;
                document.getElementById('trailer-section').style.display = 'block';
            }
        }

        // ── SHARE BUTTON ────────────────────────────────────
        function shareDetailUrl() {
            const temp = document.createElement('input');
            document.body.appendChild(temp);
            temp.value = window.location.href;
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            showToast('Link copied to clipboard!', 'success', 'fa-link');
        }

        // ── CUSTOM ANIMATED DROPDOWN (SEASON) ───────────────
        let currentSeasonIdx = 0;

        function toggleDropdown() {
            document.getElementById('season-dropdown').classList.toggle('open');
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('season-dropdown');
            if (dropdown && !dropdown.contains(e.target)) {
                dropdown.classList.remove('open');
            }
        });

        // ── DESCRIPTION TOGGLE ──────────────────────────────
        function toggleDescription() {
            const descEl = document.getElementById('d-desc');
            const btn = document.getElementById('d-show-more');
            const isCollapsed = descEl.classList.contains('desc-collapsed');

            if (isCollapsed) {
                descEl.classList.remove('desc-collapsed');
                btn.classList.add('expanded');
                btn.innerHTML = 'Show Less <i class="fas fa-chevron-up"></i>';
            } else {
                descEl.classList.add('desc-collapsed');
                btn.classList.remove('expanded');
                btn.innerHTML = 'Show More <i class="fas fa-chevron-down"></i>';
            }
        }

        function buildSeasonSelect() {
            const dropdownParams = document.getElementById('season-dropdown');
            const menu = document.getElementById('dd-menu');
            const label = document.getElementById('dd-label');
            menu.innerHTML = '';

            const seasons = animeData.seasons || [];
            if (seasons.length <= 1) {
                dropdownParams.style.display = 'none';
                return;
            }

            dropdownParams.style.display = 'block';
            label.textContent = seasons[0]?.name || 'Season 1';

            seasons.forEach((s, i) => {
                const item = document.createElement('div');
                item.className = 'dd-item' + (i === 0 ? ' active' : '');
                item.textContent = s.name || `Season ${i + 1}`;
                item.onclick = () => {
                    currentSeasonIdx = i;
                    label.textContent = item.textContent;
                    dropdownParams.classList.remove('open');

                    // Update active styling
                    menu.querySelectorAll('.dd-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');

                    renderDetailEpisodes();
                };
                menu.appendChild(item);
            });
        }

        // ── THUMBNAIL GENERATOR ─────────────────────────────
        const thumbnailCache = {};
        const thumbObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    const videoUrl = img.dataset.video;
                    const fallback = img.dataset.fallback;

                    if (thumbnailCache[videoUrl]) {
                        img.src = thumbnailCache[videoUrl];
                    } else if (videoUrl && !videoUrl.includes('youtube.com') && !videoUrl.includes('vimeo.com')) {
                        generateVideoThumbnail(videoUrl, img, fallback);
                    } else {
                        img.src = fallback;
                    }
                    observer.unobserve(img);
                }
            });
        }, { rootMargin: '100px' });

        function generateVideoThumbnail(url, imgEl, fallback) {
            const video = document.createElement('video');
            video.crossOrigin = 'anonymous'; // Requirement for canvas export
            video.muted = true;
            video.playsInline = true;

            let hasSeeked = false;

            video.addEventListener('loadedmetadata', () => {
                // Seek to a random frame between 10% and 80% to avoid intro/outro
                const percent = 0.1 + (Math.random() * 0.7);
                video.currentTime = video.duration ? video.duration * percent : 10;
            });

            video.addEventListener('seeked', () => {
                if (hasSeeked) return;
                hasSeeked = true;
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.max(video.videoWidth || 320, 320);
                    canvas.height = Math.max(video.videoHeight || 180, 180);
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                    thumbnailCache[url] = dataUrl;
                    imgEl.src = dataUrl;
                } catch (e) {
                    // Falls back if Canvas is blocked by CORS
                    imgEl.src = fallback;
                }
                // Cleanup
                video.removeAttribute('src');
                video.load();
            });

            video.addEventListener('error', () => {
                imgEl.src = fallback;
            });

            // Prevent browser from aggressively caching the same video segment
            // especially if multiple episodes point to the same server
            const cacheBuster = url.includes('?') ? `&_cb=${Date.now()}_${Math.floor(Math.random() * 1000)}` : `?_cb=${Date.now()}_${Math.floor(Math.random() * 1000)}`;
            video.src = url + cacheBuster;
            video.load();
        }

        let epRangeStart = 0;
        const EP_RANGE_SIZE = 50;

        function renderDetailEpisodes() {
            const sIdx = currentSeasonIdx;
            const eps = animeData.seasons?.[sIdx]?.episodes || [];
            const label = document.getElementById('ep-count-label');
            label.innerText = `${eps.length} Episode${eps.length !== 1 ? 's' : ''}`;
            epRangeStart = 0;
            buildEpRangeBar(eps);
            renderEpList(eps, sIdx);
        }

        function filterDetailEpisodes() {
            const q = document.getElementById('ep-search').value.toLowerCase();
            const sIdx = currentSeasonIdx;
            const eps = animeData.seasons?.[sIdx]?.episodes || [];
            const filtered = eps.filter((e, i) =>
                e.title.toLowerCase().includes(q) || String(i + 1).includes(q)
            );
            document.getElementById('ep-range-bar').innerHTML = '';
            renderEpList(filtered, sIdx, eps);
        }

        function buildEpRangeBar(eps, sIdx = currentSeasonIdx) {
            const bar = document.getElementById('ep-range-bar');
            bar.innerHTML = '';
            if (eps.length <= EP_RANGE_SIZE) return;

            // Calculate continuous numbering offset
            let episodeOffset = 0;
            for (let s = 0; s < sIdx; s++) {
                episodeOffset += (animeData.seasons[s]?.episodes || []).length;
            }

            const chunks = Math.ceil(eps.length / EP_RANGE_SIZE);
            for (let i = 0; i < chunks; i++) {
                const start = i * EP_RANGE_SIZE;
                const end = Math.min(start + EP_RANGE_SIZE, eps.length);
                const chip = document.createElement('button');
                chip.className = 'ep-range-chip' + (i === 0 ? ' active' : '');
                chip.textContent = `Ep ${episodeOffset + start + 1}-${episodeOffset + end}`;
                chip.onclick = () => {
                    epRangeStart = start;
                    bar.querySelectorAll('.ep-range-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    const allEps = animeData.seasons?.[sIdx]?.episodes || [];
                    renderEpList(allEps, sIdx);
                };
                bar.appendChild(chip);
            }
        }

        function renderEpList(eps, sIdx, allEps) {
            const container = document.getElementById('ep-list');
            container.innerHTML = '';
            if (!eps.length) {
                container.innerHTML = '<p style="color:var(--text-3);padding:20px 0;font-size:0.9rem;">No episodes found.</p>';
                return;
            }

            const useRange = eps.length > EP_RANGE_SIZE && !allEps;
            const visibleEps = useRange ? eps.slice(epRangeStart, epRangeStart + EP_RANGE_SIZE) : eps;

            // Calculate continuous numbering offset
            let episodeOffset = 0;
            for (let s = 0; s < sIdx; s++) {
                episodeOffset += (animeData.seasons[s]?.episodes || []).length;
            }

            // --- Note: Render Episode HTML logic begins here ---
            visibleEps.forEach((ep, i) => {
                if (!ep) return;
                const realEps = allEps || eps;
                const realIdx = realEps.indexOf(ep) !== -1 ? realEps.indexOf(ep) : (useRange ? epRangeStart + i : i);
                const absoluteEpNum = episodeOffset + realIdx + 1;

                // Rich TMDB episode mapping (thumbnails, titles, synopses)
                const tmdbEp = animeData.tmdbEpisodes ? animeData.tmdbEpisodes[absoluteEpNum - 1] : null;
                if (tmdbEp) {
                    if (tmdbEp.still) ep.thumbnail = tmdbEp.still;
                    if (tmdbEp.title) ep.displayTitle = `${absoluteEpNum}. ${tmdbEp.title}`;
                    if (tmdbEp.overview) ep.overview = tmdbEp.overview;
                }

                const available = Boolean((ep.url || ep.link || ep.urlSub || '').trim());
                let langBadges = '';
                if (ep.url || ep.link) langBadges += '<span style="color:#f59e0b;font-size:0.55rem;background:rgba(245,158,11,0.1);padding:1px 4px;border-radius:3px;margin-left:6px;font-weight:700;vertical-align:middle;">DUB</span>';
                if (ep.urlSub) langBadges += '<span style="color:#38bdf8;font-size:0.55rem;background:rgba(56,189,248,0.1);padding:1px 4px;border-radius:3px;margin-left:6px;font-weight:700;vertical-align:middle;">SUB</span>';
                const item = document.createElement('div');
                item.className = `ep-list-item${available ? '' : ' unavailable-ep'}`;

                let thumbHtml = '';
                const baseFallback = animeData.banner || animeData.image;

                if (ep.thumbnail) {
                    thumbHtml = `<img class="ep-li-thumb" src="${ep.thumbnail}" alt="" onerror="this.src='${baseFallback}'">`;
                } else if (ep.link) {
                    // Will be intercepted by IntersectionObserver
                    thumbHtml = `<img class="ep-li-thumb lazy-ep-thumb" data-video="${ep.link}" data-fallback="${baseFallback}" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 9'%3E%3Crect width='16' height='9' fill='%231a1a1f'/%3E%3C/svg%3E" style="object-fit:cover;">`;
                } else {
                    thumbHtml = `<img class="ep-li-thumb" src="${baseFallback}" alt="">`;
                }

                const duration = ep.duration ? `<div class="ep-li-duration"><i class="fas fa-clock" style="font-size:0.6rem"></i>${ep.duration}</div>` : '';
                const displayEpTitle = ep.displayTitle || ep.title || `Episode ${absoluteEpNum}`;

                item.innerHTML = `
                    <div class="ep-li-thumb-wrap">
                        <div class="ep-li-num">${absoluteEpNum}</div>
                        ${thumbHtml}
                        <div class="ep-li-play-overlay"><i class="fas ${available ? 'fa-play' : 'fa-lock'}"></i></div>
                        ${available ? '' : '<div class="ep-li-unavailable">Unavailable</div>'}
                    </div>
                    <div class="ep-li-info">
                        <div class="ep-li-title">${displayEpTitle}${langBadges}</div>
                        ${duration}
                    </div>
                    ${ep.overview ? `<div class="ep-overview-chip">${ep.overview}</div>` : ''}`;

                item.onclick = () => {
                    if (!available) {
                        if (typeof showToast === 'function') showToast('This episode is not available yet.', 'info');
                        return;
                    }
                    window.location.href = `watch.html?anime=${animeId}&season=${sIdx}&ep=${realIdx}`;
                };
                container.appendChild(item);
            });

            // Start observing the lazy thumbnails
            container.querySelectorAll('.lazy-ep-thumb').forEach(img => {
                thumbObserver.observe(img);
            });
        }

        // ── SCROLL BUTTONS LOGIC ────────────────────────────
        function scrollRow(rowId, amount) {
            const row = document.getElementById(rowId);
            if (row) {
                row.scrollBy({ left: amount, behavior: 'smooth' });
            }
        }

        function updateScrollButtons(rowId, leftBtnId, rightBtnId) {
            const row = document.getElementById(rowId);
            const leftBtn = document.getElementById(leftBtnId);
            const rightBtn = document.getElementById(rightBtnId);
            if (!row || !leftBtn || !rightBtn) return;

            const checkScroll = () => {
                leftBtn.style.display = row.scrollLeft > 0 ? 'flex' : 'none';
                rightBtn.style.display = row.scrollLeft < (row.scrollWidth - row.clientWidth - 5) ? 'flex' : 'none';
            };

            row.addEventListener('scroll', checkScroll);
            window.addEventListener('resize', checkScroll);
            checkScroll();
        }

        // ── PLAY NOW ────────────────────────────────────────
        function playNow() {
            if ((animeData.type || '').toLowerCase() === 'movie') {
                window.location.href = `watch.html?anime=${animeId}`;
            } else {
                window.location.href = `watch.html?anime=${animeId}&season=0&ep=0`;
            }
        }

        // ── SCROLL BUTTONS LOGIC ────────────────────────────
        function scrollRow(rowId, amount) {
            const row = document.getElementById(rowId);
            if (row) {
                row.scrollBy({ left: amount, behavior: 'smooth' });
            }
        }

        function updateScrollButtons(rowId, leftBtnId, rightBtnId) {
            const row = document.getElementById(rowId);
            const leftBtn = document.getElementById(leftBtnId);
            const rightBtn = document.getElementById(rightBtnId);
            if (!row || !leftBtn || !rightBtn) return;

            const checkScroll = () => {
                leftBtn.style.display = row.scrollLeft > 0 ? 'flex' : 'none';
                rightBtn.style.display = row.scrollLeft < (row.scrollWidth - row.clientWidth - 5) ? 'flex' : 'none';
            };

            row.addEventListener('scroll', checkScroll);
            window.addEventListener('resize', checkScroll);
            checkScroll();
        }

        // ── MY LIST ─────────────────────────────────────────
        function checkDetailListStatus() {
            if (!currentUser) return;
            db.collection('users').doc(currentUser.uid).collection('mylist').doc(animeId).get()
                .then(doc => {
                    detailInList = doc.exists;
                    updateListBtn();
                });
        }

        function updateListBtn() {
            const btn = document.getElementById('d-list-btn');
            const icon = document.getElementById('d-list-icon');
            const txt = document.getElementById('d-list-text');
            if (detailInList) {
                btn.classList.add('in-list');
                icon.className = 'fas fa-check';
                txt.innerText = 'In Watchlist';
            } else {
                btn.classList.remove('in-list');
                icon.className = 'fas fa-plus';
                txt.innerText = 'Watchlist';
            }
        }

        function toggleDetailList() {
            if (!currentUser) { showToast('Sign in to save titles', 'info', 'fa-lock'); return; }
            const ref = db.collection('users').doc(currentUser.uid).collection('mylist').doc(animeId);
            if (detailInList) {
                ref.delete().then(() => {
                    detailInList = false; updateListBtn();
                    showToast('Removed from Watchlist', 'info', 'fa-heart-crack');
                });
            } else {
                ref.set({
                    title: animeData.title, image: animeData.image,
                    type: animeData.type, sub: animeData.sub || 0,
                    dub: animeData.dub || 0, timestamp: Date.now(),
                    is18Plus: animeData.is18Plus || false
                }).then(() => {
                    detailInList = true; updateListBtn();
                    showToast('Added to Watchlist!', 'success', 'fa-heart');
                });
            }
        }

        // ── RELATED ─────────────────────────────────────────
        function renderRelated() {
            const grid = document.getElementById('related-grid');
            const genres = animeData.genres || [];
            // Find titles sharing at least one genre, exclude self
            let related = allContent.filter(c =>
                c.id !== animeId &&
                (c.genres || []).some(g => genres.includes(g))
            ).slice(0, 12);
            // fallback: just grab others
            if (!related.length) related = allContent.filter(c => c.id !== animeId).slice(0, 12);
            grid.innerHTML = '';
            related.forEach(item => {
                const card = createNetflixCard(item);
                card.style.minWidth = 'unset';
                grid.appendChild(card);
            });
        }

        // Close trailer modal on ESC
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeTrailerModal({ type: 'click', target: document.getElementById('trailer-modal'), currentTarget: document.getElementById('trailer-modal') });
        });

        // ── UTILS ────────────────────────────────────────────
        function capitalize(s) { return s ? s[0].toUpperCase() + s.slice(1) : ''; }

        // ── TRAILER MODAL ─────────────────────────────────────
        function openTrailerModal() {
            const iframe = document.getElementById('trailer-modal-iframe');
            const src = iframe.dataset.src;
            if (!src) return;
            iframe.src = src;   // load iframe only on open
            document.getElementById('trailer-modal').classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        function closeTrailerModal(e) {
            // Close if clicking overlay background or close button
            if (e && e.target !== document.getElementById('trailer-modal') && e.type !== 'click') return;
            if (e && e.currentTarget && e.target !== e.currentTarget && e.type === 'click') {
                // clicked inside modal-inner, not the overlay
                if (!e.target.classList.contains('trailer-modal-close') && !e.target.closest('.trailer-modal-close')) return;
            }
            const iframe = document.getElementById('trailer-modal-iframe');
            iframe.src = '';    // stop video on close
            document.getElementById('trailer-modal').classList.remove('open');
            document.body.style.overflow = '';
        }


        // Close trailer modal on ESC key
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                const modal = document.getElementById('trailer-modal');
                if (modal && modal.classList.contains('open')) {
                    document.getElementById('trailer-modal-iframe').src = '';
                    modal.classList.remove('open');
                    document.body.style.overflow = '';
                }
            }
        });

    </script>
