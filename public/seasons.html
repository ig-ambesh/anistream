<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seasonal Time Machine - AniStream</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            padding-top: 70px;
            min-height: 100vh;
            background-color: #0c0c0e;
            color: white;
            font-family: 'Outfit', sans-serif;
        }

        .seasons-hero {
            padding: 80px 5% 40px;
            text-align: center;
            position: relative;
        }

        .seasons-hero::before {
            content: '';
            position: absolute;
            top: -20%; left: 50%;
            transform: translateX(-50%);
            width: 80%; height: 300px;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.1) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        .lb-title {
            font-size: 3.5rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #ffffff 40%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        @media (max-width: 768px) {
            .lb-title {
                font-size: 2.5rem;
            }
        }

        .lb-desc {
            color: #a1a1aa;
            max-width: 600px;
            margin: 0 auto;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(96, 165, 250, 0.08);
            color: #60a5fa;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            margin-bottom: 20px;
            border: 1px solid rgba(96, 165, 250, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(96, 165, 250, 0.1);
        }

        /* ── TIME MACHINE CONTROLS ────────────────────────── */
        .time-machine-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            padding: 0 5%;
        }

        .tm-select {
            background: rgba(255, 255, 255, 0.03);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 24px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .tm-select:hover, .tm-select:focus {
            border-color: rgba(229, 25, 58, 0.4);
            background: rgba(255, 255, 255, 0.05);
        }

        .tm-select option {
            background: #0c0c0e;
            color: white;
            padding: 10px;
        }

        .tm-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 13px 32px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(229, 25, 58, 0.35);
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .tm-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(229, 25, 58, 0.5);
            background: #ff1c43;
        }

        /* ── CARD GRID ─────────────────────────────────────── */
        .lb-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
            padding: 20px 5% 60px;
            margin-bottom: 50px;
        }

        .content-card {
            position: relative;
            aspect-ratio: 2/3;
            border-radius: 18px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .content-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(12, 12, 14, 0.95) 95%);
            z-index: 2;
            transition: opacity 0.3s;
        }

        .content-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(229, 25, 58, 0.4);
            box-shadow: 0 15px 35px rgba(229, 25, 58, 0.2), 0 0 30px rgba(229, 25, 58, 0.1);
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .content-card:hover .card-img {
            transform: scale(1.08);
        }

        .card-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 20px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 700;
            color: white;
            font-family: 'Outfit', sans-serif;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-2);
        }

        .card-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .card-meta i {
            font-size: 0.72rem;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav id="navbar">
        <div style="display:flex;align-items:center;gap:35px;">
            <a href="index.html" class="logo">AniStream</a>
            <div class="nav-links">
                <button onclick="window.location.href='index.html'">Home</button>
                <button onclick="window.location.href='leaderboards.html'">Leaderboards</button>
                <button class="active">Archives</button>
                <button onclick="window.location.href='schedule.html'">Schedule</button>
                <button onclick="window.location.href='mylist.html'">My List</button>
            </div>
        </div>
        <div class="nav-right">
            <button class="search-trigger" onclick="window.location.href='index.html'" title="Search on Home"><i class="fas fa-search"></i></button>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <header class="seasons-hero">
        <div class="hero-tag">
            <i class="fas fa-hourglass-half"></i> Time Machine
        </div>
        <h1 class="lb-title">Seasonal Archives</h1>
        <p class="lb-desc">Travel back in time and discover the anime that aired during any specific year and season.</p>

        <div class="time-machine-controls">
            <select id="season-select" class="tm-select">
                <option value="winter">Winter</option>
                <option value="spring">Spring</option>
                <option value="summer">Summer</option>
                <option value="fall">Fall</option>
            </select>
            <select id="year-select" class="tm-select"></select>
            <button class="tm-btn" onclick="fetchSeason()">Go</button>
        </div>
    </header>

    <!-- MAIN GRID -->
    <div class="lb-grid" id="lb-grid"></div>

    <script src="script.js"></script>
    <script>
        // Set up navbar scroll effect
        window.addEventListener('scroll', () => {
            document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 50);
        });

        // Populate years
        const currentYear = new Date().getFullYear();
        const yearSelect = document.getElementById('year-select');
        for (let y = currentYear + 1; y >= 1990; y--) {
            const opt = document.createElement('option');
            opt.value = y;
            opt.innerText = y;
            if (y === currentYear) opt.selected = true;
            yearSelect.appendChild(opt);
        }

        // Determine current season
        const month = new Date().getMonth();
        let currSeason = 'winter';
        if (month >= 3 && month <= 5) currSeason = 'spring';
        else if (month >= 6 && month <= 8) currSeason = 'summer';
        else if (month >= 9 && month <= 11) currSeason = 'fall';
        document.getElementById('season-select').value = currSeason;

        async function fetchSeason() {
            const year = document.getElementById('year-select').value;
            const season = document.getElementById('season-select').value;
            
            const grid = document.getElementById('lb-grid');
            grid.innerHTML = `
                <div class="loading-wrapper" style="grid-column: 1 / -1; min-height: 40vh;">
                    <div class="loader"></div>
                    <h3>Loading ${season.charAt(0).toUpperCase() + season.slice(1)} ${year}...</h3>
                </div>
            `;

            try {
                const data = await getJson(`/jikan/seasons/${year}/${season}`, []);
                
                if (!data || data.length === 0) {
                    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#777;padding:50px;">No anime found for this season.</div>';
                    return;
                }

                grid.innerHTML = '';
                data.forEach(item => {
                    const title = item.title_english || item.title || 'Untitled Anime';
                    
                    const card = document.createElement('div');
                    card.className = 'content-card';
                    card.style.position = 'relative';
                    card.onclick = () => window.location.href = `detail.html?anime=${encodeURIComponent(title)}`;
                    
                    let scoreHtml = '';
                    if(item.score) {
                        scoreHtml = `<span><i class="fas fa-star" style="color:#f5c518"></i> ${item.score}</span>`;
                    }
                    
                    card.innerHTML = `
                        <img src="${item.images?.jpg?.large_image_url || item.images?.jpg?.image_url}" class="card-img" alt="${title}" loading="lazy">
                        <div class="card-overlay">
                            <div class="card-title">${title}</div>
                            <div class="card-meta">
                                ${scoreHtml}
                                <span><i class="fas fa-tv"></i> ${item.type || 'TV'}</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch(e) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#ff5050;padding:50px;">Failed to load season data.</div>';
            }
        }

        // Initialize
        fetchSeason();
    </script>
</body>
</html>
