<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watching — AniStream</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="theme-color" content="#0b0b14">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --wp-bg: #0b0b14;
            --wp-sidebar: #0f0f1a;
            --wp-card: rgba(255,255,255,0.03);
            --wp-border: rgba(255,255,255,0.06);
            --wp-accent: #e5193a;
            --wp-accent-glow: rgba(229,25,58,0.25);
            --wp-purple: #8b5cf6;
            --wp-green: #22c55e;
            --wp-text: #f0f0f5;
            --wp-text2: #a1a1aa;
            --wp-text3: #52525b;
        }
        body {
            background: var(--wp-bg);
            color: var(--wp-text);
            overflow-x: hidden;
            font-family: 'Outfit', sans-serif;
        }

        #navbar {
            background: var(--wp-bg) !important;
            box-shadow: 0 2px 20px rgba(0,0,0,0.6);
        }

        .breadcrumb {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.78rem; color: var(--wp-text3);
            padding: 10px 16px; font-weight: 500;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            background: rgba(0,0,0,0.3);
            margin-top: 60px;
        }
        .breadcrumb a { color: var(--wp-text2); text-decoration: none; transition: color 0.2s; }
        .breadcrumb a:hover { color: var(--wp-accent); }
        .breadcrumb i { font-size: 0.55rem; color: var(--wp-text3); }
        .breadcrumb .current { color: #fff; font-weight: 600; }

        .watch-container {
            display: grid;
            grid-template-columns: 260px 1fr 300px; /* Slightly narrower sidebars for a bigger player */
            min-height: calc(100vh - 60px);
        }

        /* LEFT SIDEBAR */
        .ep-sidebar {
            background: var(--wp-sidebar);
            border-right: 1px solid var(--wp-border);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 60px);
            position: sticky;
            top: 60px;
        }
        .ep-sidebar-header {
            padding: 14px 16px 10px;
            border-bottom: 1px solid var(--wp-border);
            flex-shrink: 0;
        }
        .ep-sidebar-title {
            font-size: 0.82rem; font-weight: 700; color: var(--wp-text);
            display: flex; align-items: center; justify-content: space-between;
        }
        .ep-search-input {
            width: 100%; margin-top: 10px;
            background: rgba(255,255,255,0.04); border: 1px solid var(--wp-border);
            padding: 8px 12px; border-radius: 8px; color: white;
            font-size: 0.8rem; outline: none; font-family: 'Outfit', sans-serif;
        }
        .ep-list-scroll {
            flex: 1; overflow-y: auto; padding: 6px 0;
        }
        .ep-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 16px; cursor: pointer;
            transition: all 0.15s ease; border-left: 3px solid transparent;
        }
        .ep-item:hover { background: rgba(255,255,255,0.04); }
        .ep-item.active {
            background: linear-gradient(90deg, rgba(139,92,246,0.12), transparent);
            border-left-color: var(--wp-purple);
        }
        .ep-item-num { font-size: 0.82rem; font-weight: 700; color: var(--wp-text3); width: 20px; }
        .ep-item-title { font-size: 0.82rem; color: var(--wp-text2); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* CENTER AREA */
        .player-center { display: flex; flex-direction: column; background: #000; }
        .player-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
        .player-wrapper iframe, .player-wrapper video { width: 100%; height: 100%; border: none; }

        .controls-bar {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--wp-sidebar);
            padding: 10px 16px; gap: 8px;
            border-bottom: 1px solid var(--wp-border);
        }
        .cb-group { display: flex; align-items: center; gap: 8px; }
        .cb-btn {
            background: transparent; border: none; color: var(--wp-text2);
            display: flex; align-items: center; gap: 5px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
        }
        .cb-btn.active { color: var(--wp-green); }
        .nav-btn {
            background: rgba(255,255,255,0.06); border: 1px solid var(--wp-border);
            color: #fff; padding: 6px 14px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
        }
        /* Now Watching & Server Redesign */
        .now-watching {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--wp-border);
            border-radius: 12px;
            margin: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .nw-ep {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nw-ep::before {
            content: 'NOW PLAYING';
            font-size: 0.6rem;
            color: var(--wp-accent);
            letter-spacing: 1px;
            padding: 2px 6px;
            background: rgba(229, 25, 58, 0.1);
            border-radius: 4px;
        }

        .nw-servers {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .nw-server-row {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
            padding: 5px 0;
            width: 100%;
            -webkit-overflow-scrolling: touch; /* Smooth scroll on iOS */
        }
        .nw-server-row::-webkit-scrollbar { display: none; }
        
        .nw-server-label {
            font-size: 0.6rem;
            font-weight: 800;
            color: var(--wp-text3);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            min-width: 42px;
            flex-shrink: 0;
        }
        .nw-server-label i { font-size: 0.7rem; margin-right: 2px; }

        .server-pill {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--wp-text2);
            padding: 6px 12px;
            border-radius: 18px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s var(--ease-out);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .server-pill i { font-size: 0.65rem; opacity: 0.8; }
        .server-pill:hover { background: rgba(255,255,255,0.08); transform: translateY(-1px); }
        .server-pill.active {
            background: var(--wp-accent);
            border-color: var(--wp-accent);
            color: #fff;
            box-shadow: 0 4px 12px var(--wp-accent-glow);
        }

        /* RIGHT SIDEBAR (Restored) */
        .info-sidebar {
            background: var(--wp-sidebar);
            border-left: 1px solid var(--wp-border);
            height: calc(100vh - 60px);
            position: sticky;
            top: 60px;
            overflow-y: auto;
            padding: 20px 16px;
        }
        .info-poster { width: 100%; border-radius: 10px; margin-bottom: 14px; border: 1px solid var(--wp-border); box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
        .info-title { font-size: 1.2rem; font-weight: 800; color: white; margin-bottom: 10px; }
        .info-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; }
        .info-badge { font-size: 0.62rem; font-weight: 700; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
        .ib-genre { background: rgba(255,255,255,0.04); color: var(--wp-text2); border: 1px solid rgba(255,255,255,0.08); }

        .related-card {
            display: flex; gap: 10px; padding: 8px; border-radius: 8px;
            background: rgba(255,255,255,0.02); border: 1px solid transparent;
            margin-bottom: 8px; cursor: pointer; transition: all 0.2s;
        }
        .rc-thumb { width: 50px; height: 70px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
        .rc-title { font-size: 0.78rem; font-weight: 600; color: white; line-height: 1.3; }

        /* ══════════════════════════════════════
           💻 DESKTOP & LAPTOP STYLES
           ══════════════════════════════════════ */
        @media (min-width: 1025px) {
            .watch-container {
                display: grid;
                grid-template-columns: 260px 1fr 300px;
                min-height: calc(100vh - 60px);
                margin-top: 60px;
            }
            .ep-sidebar {
                background: var(--wp-sidebar);
                border-right: 1px solid var(--wp-border);
                height: calc(100vh - 60px);
                position: sticky;
                top: 60px;
                display: flex;
                flex-direction: column;
            }
            .info-sidebar {
                background: var(--wp-sidebar);
                border-left: 1px solid var(--wp-border);
                height: calc(100vh - 60px);
                position: sticky;
                top: 60px;
                overflow-y: auto;
                padding: 20px 16px;
            }
            .player-wrapper {
                width: 100%;
                position: relative;
                padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
                height: 0;
                background: #000;
            }
            .player-wrapper iframe, .player-wrapper video {
                position: absolute;
                top: 0; left: 0;
                width: 100%; height: 100%;
                border: none;
            }
            .ep-item { padding: 12px 16px; }
        }

        /* ══════════════════════════════════════
           📱 MOBILE & TABLET STYLES
           ══════════════════════════════════════ */
        @media (max-width: 1024px) {
            .watch-container {
                display: flex;
                flex-direction: column;
                margin-top: 60px;
                max-width: 100vw;
                overflow-x: hidden;
            }
            .player-center {
                display: flex;
                flex-direction: column;
                order: 1;
            }
            .player-wrapper {
                position: sticky;
                top: 60px;
                z-index: 101;
                width: 100%;
                padding-bottom: 56.25%;
                height: 0;
                background: #000;
            }
            .player-wrapper iframe, .player-wrapper video {
                position: absolute;
                top: 0; left: 0;
                width: 100%; height: 100%;
                border: none;
            }
            .controls-bar {
                position: sticky;
                top: calc(60px + 56.25vw);
                z-index: 100;
                background: rgba(15, 15, 26, 0.98);
                backdrop-filter: blur(10px);
                display: flex;
                flex-direction: column;
                padding: 10px 12px;
                gap: 8px;
                border-bottom: 1px solid var(--wp-border);
                box-shadow: 0 4px 15px rgba(0,0,0,0.4);
                margin-bottom: 10px; /* Safety gap */
            }
            .cb-group {
                width: 100%;
                justify-content: space-between;
                display: flex;
                gap: 8px;
            }
            .cb-btn {
                font-size: 0.7rem;
                padding: 4px 8px;
                background: rgba(255,255,255,0.03);
                border-radius: 6px;
                border: 1px solid rgba(255,255,255,0.05);
            }
            .nav-btn {
                flex: 1;
                justify-content: center;
                padding: 7px;
                font-size: 0.72rem;
                border-radius: 6px;
                background: rgba(255,255,255,0.05);
                border: 1px solid rgba(255,255,255,0.1);
            }
            .ep-sidebar {
                order: 2;
                background: var(--wp-bg);
            }
            .ep-list-scroll {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
                gap: 6px 4px; /* Tiny gap between items */
                padding: 10px;
                align-content: start; /* Fix: Force rows to stay at the top */
                justify-content: start;
            }
            .ep-item {
                background: rgba(255,255,255,0.03);
                border: 1px solid var(--wp-border);
                border-radius: 4px;
                padding: 4px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 35px; /* Ultra-compact height */
            }
            .ep-item .ep-item-title { display: none; }
            .ep-item .ep-item-num {
                font-size: 0.8rem;
                font-weight: 700;
                color: var(--wp-text2);
            }
            .ep-item.active { border-color: var(--wp-purple); background: rgba(139,92,246,0.15); }
            
            .now-watching { 
                overflow: hidden; 
                padding: 10px; 
                gap: 10px; 
                margin: 70px 10px 10px 10px; /* Increased to 70px for perfect separation */
            }
            .nw-server-row { gap: 8px; }

            .info-sidebar { order: 3; background: var(--wp-bg); padding: 15px 12px; }
            .info-poster { display: none; }
            .breadcrumb { display: none; }
        }
    </style>
</head>
<body>

    <nav id="navbar">
        <div style="display:flex;align-items:center;gap:35px;">
            <a href="index.html" class="logo">AniStream</a>
            <div class="nav-links">
                <button onclick="window.location.href='index.html'">Home</button>
                <button onclick="window.location.href='index.html'">Series</button>
                <button onclick="window.location.href='index.html'">Movies</button>
                <button onclick="window.location.href='mylist.html'">My List</button>
            </div>
        </div>
    </nav>

    <div class="breadcrumb" id="w-breadcrumb">
        <a href="index.html">Home</a> <i class="fas fa-chevron-right"></i>
        <a href="#" id="bc-anime-link">Anime Title</a> <i class="fas fa-chevron-right"></i>
        <span class="current" id="bc-ep">Episode 1</span>
    </div>

    <div class="watch-container">
        <!-- LEFT: EPISODE LIST -->
        <div class="ep-sidebar">
            <div class="ep-sidebar-header">
                <div class="ep-sidebar-title">Episodes <span id="ep-total-badge"></span></div>
                <input type="text" class="ep-search-input" id="ep-search" placeholder="Search..." onkeyup="filterEps()">
            </div>
            <div class="ep-list-scroll" id="ep-list-scroll"></div>
        </div>

        <!-- CENTER: PLAYER -->
        <div class="player-center">
            <div class="player-wrapper">
                <iframe id="video-player" src="" frameborder="0" 
                    sandbox="allow-scripts allow-same-origin allow-forms"
                    allowfullscreen></iframe>
            </div>

            <div class="controls-bar">
                <div class="cb-group">
                    <button class="cb-btn" onclick="toggleExpand()"><i class="fas fa-expand"></i> Expand</button>
                    <button class="cb-btn active" id="cb-autoplay"><i class="fas fa-play-circle"></i> Auto Play</button>
                    <button class="cb-btn" id="cb-priority" onclick="togglePriority()"><i class="fas fa-language"></i> Priority: <span id="priority-label">SUB</span></button>
                </div>
                <div class="cb-group">
                    <button class="nav-btn" id="btn-prev" onclick="playPrevEpisode()">Prev</button>
                    <button class="nav-btn" id="btn-next" onclick="playNextEpisode()">Next</button>
                </div>
            </div>

            <div class="now-watching">
                <div class="nw-info">
                    <div class="nw-ep" id="nw-ep-display">Episode 1</div>
                </div>
                <div class="nw-servers" id="nw-servers-list"></div>
            </div>
        </div>

        <!-- RIGHT: INFO -->
        <div class="info-sidebar">
            <img class="info-poster" id="info-poster" src="">
            <h1 class="info-title" id="info-title">Loading...</h1>
            <div class="info-badges" id="info-badges"></div>
            <p id="info-desc" style="font-size: 0.82rem; color: var(--wp-text2); line-height: 1.55; margin-bottom: 20px;"></p>
            <div class="related-title" style="color:white; font-weight:700; margin-bottom:15px; border-top: 1px solid var(--wp-border); padding-top: 15px;">More Like This</div>
            <div id="related-grid"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        let curSeason = 0; let curEp = 0;
        const animeIdUrl = new URLSearchParams(window.location.search).get('anime');

        function toggleExpand() {
            const ifr = document.getElementById('video-player');
            if (ifr.requestFullscreen) ifr.requestFullscreen();
        }

        function togglePriority() {
            const cur = localStorage.getItem('anistream_priority') || 'sub';
            const next = cur === 'sub' ? 'dub' : 'sub';
            localStorage.setItem('anistream_priority', next);
            document.getElementById('priority-label').textContent = next.toUpperCase();
            // Reload episode to apply new priority
            playEpisode(curSeason, curEp);
        }

        // Initialize priority label
        window.addEventListener('DOMContentLoaded', () => {
            const p = localStorage.getItem('anistream_priority') || 'sub';
            const label = document.getElementById('priority-label');
            if (label) label.textContent = p.toUpperCase();
        });

        window.setLang = function(lang) {
            localStorage.setItem('anistream_lang', lang);
            playEpisode(curSeason, curEp);
        };

        window._updateLangTabs = function(ep, activeLang) {
            const container = document.getElementById('nw-servers-list');
            let html = '';
            if (ep.urlSub) {
                html += `
                <div class="nw-server-row">
                    <span class="nw-server-label" style="color:#38bdf8"><i class="fas fa-closed-captioning"></i> SUB</span>
                    <button class="server-pill ${activeLang === 'sub' ? 'active' : ''}" onclick="setLang('sub')">
                        <i class="fas fa-server"></i> Main Server
                    </button>
                </div>`;
            }
            if (ep.url || ep.link) {
                html += `
                <div class="nw-server-row">
                    <span class="nw-server-label" style="color:#f59e0b"><i class="fas fa-microphone"></i> DUB</span>
                    <button class="server-pill ${activeLang === 'dub' ? 'active' : ''}" onclick="setLang('dub')">
                        <i class="fas fa-server"></i> Main Server
                    </button>
                </div>`;
            }
            container.innerHTML = html;
        };

        const _origPlay = window.playEpisode;
        window.playEpisode = function(s, e) {
            if (_origPlay) _origPlay(s, e);
            curSeason = s; curEp = e;
            document.getElementById('nw-ep-display').textContent = `Episode ${e + 1}`;
            document.querySelectorAll('.ep-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.getElementById(`ep-item-${s}-${e}`);
            if (activeItem) { activeItem.classList.add('active'); activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
        };

        const _origSetup = window.setupPlayer;
        window.setupPlayer = function(content, id, s, e) {
            if (_origSetup) _origSetup(content, id, s, e);
            document.getElementById('info-poster').src = content.image || content.banner || '';
            document.getElementById('info-title').textContent = content.title;
            document.getElementById('info-desc').textContent = content.description || '';
            buildEpisodeList(content, s || 0);
            loadRelated(id, content.genres || []);
        };

        function buildEpisodeList(d, sIdx) {
            const container = document.getElementById('ep-list-scroll');
            container.innerHTML = '';
            const eps = d.seasons?.[sIdx]?.episodes || [];
            eps.forEach((ep, i) => {
                const item = document.createElement('div');
                item.className = 'ep-item' + (i === curEp ? ' active' : '');
                item.id = `ep-item-${sIdx}-${i}`;
                item.innerHTML = `<span class="ep-item-num">${i + 1}</span><span class="ep-item-title">${ep.title || 'Episode ' + (i+1)}</span>`;
                item.onclick = () => playEpisode(sIdx, i);
                container.appendChild(item);
            });
        }

        window.playNextEpisode = function() { if (curEp < (currentAnimeData?.seasons?.[curSeason]?.episodes?.length || 0) - 1) playEpisode(curSeason, curEp + 1); };
        window.playPrevEpisode = function() { if (curEp > 0) playEpisode(curSeason, curEp - 1); };
    </script>
</body>
</html>
