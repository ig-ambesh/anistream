<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Works - AniStream</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            padding-top: 70px;
            min-height: 100vh;
            background-color: #0c0c0e;
            color: white;
            font-family: 'Outfit', sans-serif;
        }

        .studio-hero {
            padding: 80px 5% 40px;
            text-align: center;
            position: relative;
        }

        .studio-hero::before {
            content: '';
            position: absolute;
            top: -20%; left: 50%;
            transform: translateX(-50%);
            width: 80%; height: 300px;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.1) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        .lb-title {
            font-size: 3.5rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #ffffff 40%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        @media (max-width: 768px) {
            .lb-title {
                font-size: 2.5rem;
            }
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.08);
            color: #ef4444;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            margin-bottom: 20px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.1);
        }

        /* ── CARD GRID ─────────────────────────────────────── */
        .lb-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
            padding: 20px 5% 60px;
            margin-bottom: 50px;
        }

        .content-card {
            position: relative;
            aspect-ratio: 2/3;
            border-radius: 18px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .content-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(12, 12, 14, 0.95) 95%);
            z-index: 2;
            transition: opacity 0.3s;
        }

        .content-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(229, 25, 58, 0.4);
            box-shadow: 0 15px 35px rgba(229, 25, 58, 0.2), 0 0 30px rgba(229, 25, 58, 0.1);
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .content-card:hover .card-img {
            transform: scale(1.08);
        }

        .card-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 20px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 700;
            color: white;
            font-family: 'Outfit', sans-serif;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-2);
        }

        .card-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .card-meta i {
            font-size: 0.72rem;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav id="navbar">
        <div style="display:flex;align-items:center;gap:35px;">
            <a href="index.html" class="logo">AniStream</a>
            <div class="nav-links">
                <button onclick="window.location.href='index.html'">Home</button>
                <button onclick="window.location.href='leaderboards.html'">Leaderboards</button>
                <button onclick="window.location.href='seasons.html'">Archives</button>
                <button onclick="window.location.href='schedule.html'">Schedule</button>
                <button onclick="window.location.href='mylist.html'">My List</button>
            </div>
        </div>
        <div class="nav-right">
            <button class="search-trigger" onclick="window.location.href='index.html'" title="Search on Home"><i class="fas fa-search"></i></button>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <header class="studio-hero">
        <div class="hero-tag">
            <i class="fas fa-building"></i> Animation Studio
        </div>
        <h1 class="lb-title" id="studio-name">Studio Works</h1>
    </header>

    <!-- MAIN GRID -->
    <div class="lb-grid" id="lb-grid"></div>

    <script src="script.js"></script>
    <script>
        // Set up navbar scroll effect
        window.addEventListener('scroll', () => {
            document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 50);
        });

        const urlParams = new URLSearchParams(window.location.search);
        const studioId = urlParams.get('id');
        const studioNameParam = urlParams.get('name');

        if(studioNameParam) {
            document.getElementById('studio-name').innerText = studioNameParam;
            document.title = `${studioNameParam} Anime - AniStream`;
        }

        async function fetchStudioWorks() {
            if(!studioId) {
                document.getElementById('lb-grid').innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#ff5050;padding:50px;">No studio specified.</div>';
                return;
            }

            const grid = document.getElementById('lb-grid');
            grid.innerHTML = `
                <div class="loading-wrapper" style="grid-column: 1 / -1; min-height: 40vh;">
                    <div class="loader"></div>
                    <h3>Loading Works...</h3>
                </div>
            `;

            try {
                const data = await getJson(`/jikan/studio/${studioId}`, []);
                
                if (!data || data.length === 0) {
                    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#777;padding:50px;">No anime found for this studio.</div>';
                    return;
                }

                grid.innerHTML = '';
                data.forEach(item => {
                    const title = item.title_english || item.title || 'Untitled Anime';
                    
                    const card = document.createElement('div');
                    card.className = 'content-card';
                    card.style.position = 'relative';
                    card.onclick = () => window.location.href = `detail.html?anime=${encodeURIComponent(title)}`;
                    
                    let scoreHtml = '';
                    if(item.score) {
                        scoreHtml = `<span><i class="fas fa-star" style="color:#f5c518"></i> ${item.score}</span>`;
                    }
                    
                    card.innerHTML = `
                        <img src="${item.images?.jpg?.large_image_url || item.images?.jpg?.image_url}" class="card-img" alt="${title}" loading="lazy">
                        <div class="card-overlay">
                            <div class="card-title">${title}</div>
                            <div class="card-meta">
                                ${scoreHtml}
                                <span><i class="fas fa-tv"></i> ${item.type || 'TV'}</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch(e) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#ff5050;padding:50px;">Failed to load studio works.</div>';
            }
        }

        // Initialize
        fetchStudioWorks();
    </script>
</body>
</html>
